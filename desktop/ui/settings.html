<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyHand Settings</title>
<style>
  :root {
    --bg: #f6f5f8; --card: #ffffff; --text: #1d1d21; --muted: #6b6b75; --line: #e4e2ea;
    --accent: #8754f2; --accent-ink: #ffffff; --tile: #f1eff5; --focus: rgba(135, 84, 242, .35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161b; --card: #211f27; --text: #f2f1f5; --muted: #a09fab; --line: #34313d;
      --accent: #a27bff; --accent-ink: #17161b; --tile: #2a2832; --focus: rgba(162, 123, 255, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  header h1 { font: 600 22px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); }
  header .grow { flex: 1; }
  .power { border: 0; border-radius: 999px; padding: 10px 18px; font: 600 14px inherit; font-family: inherit; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .power.on { background: var(--tile); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .welcome { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: start; }
  .welcome p { margin: 0 0 6px; }
  .welcome ul { margin: 0; padding-left: 18px; color: var(--muted); }
  .welcome button { margin-left: auto; flex-shrink: 0; white-space: nowrap; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  .sub { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
  .sub h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .sub .count { color: var(--muted); font-size: 12.5px; }
  .sub .link { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .all { margin-top: 20px; }
  /* Looks like the real toolbar (ui/toolbar.html). */
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 16px; background: rgba(24, 24, 27, .92); border: 1px solid rgba(255, 255, 255, .12); }
  .slot { position: relative; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: grab; }
  .slot:hover { background: rgba(255, 255, 255, .08); }
  .slot.on { background: rgba(255, 255, 255, .18); }
  .slot.dragging { opacity: .3; }
  .slot.drop-before { box-shadow: -4px 0 0 -1px var(--accent); }
  .slot.drop-after { box-shadow: 4px 0 0 -1px var(--accent); }
  .slot img { width: 40px; height: 40px; pointer-events: none; }
  .slot .remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: #ececf1; color: #1d1d21; font: 700 11px/18px "Segoe UI", system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .12s; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
  .slot:hover .remove, .slot:focus-within .remove { opacity: 1; }
  @media (hover: none) { .slot .remove { opacity: 1; } }
  .empty { width: 40px; height: 40px; border-radius: 10px; border: 1.5px dashed rgba(255, 255, 255, .2); box-sizing: border-box; }
  .laser-dot { position: relative; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 41, 31, .55) 0%, rgba(255, 41, 31, 0) 70%); }
  .laser-dot::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: #ff291f; }
  .laser-dot::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: rgba(255, 219, 209, .95); }
  .message { color: #b45309; font-size: 12.5px; margin: 6px 0 0; }
  @media (prefers-color-scheme: dark) { .message { color: #fbbf24; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .tile { position: relative; border: 0; background: var(--tile); border-radius: 12px; padding: 10px 6px 8px; color: var(--text); font: 12px inherit; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tile:hover { box-shadow: inset 0 0 0 1px var(--line); }
  .tile img { width: 56px; height: 56px; }
  .tile .laser-dot { width: 56px; height: 56px; }
  .tile .laser-dot::before { inset: 21px; }
  .tile .laser-dot::after { inset: 25px; }
  .tile.on, .tile.on:hover { box-shadow: inset 0 0 0 2px var(--accent); }
  .tile .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tile .add { margin-top: 2px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 9px; font: 11.5px inherit; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .tile .add:hover { border-color: var(--accent); color: var(--accent); }
  .tile .add.in { border-color: transparent; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .tile .add .rm { display: none; }
  .tile .add.in:hover .rm { display: inline; }
  .tile .add.in:hover .is { display: none; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; flex-wrap: wrap; }
  .row + .row { border-top: 1px solid var(--line); }
  .row label.name { flex: 1; min-width: 180px; }
  select, input[type=range] { font: inherit; }
  select { background: var(--tile); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=range] { width: 200px; accent-color: var(--accent); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--tile); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatch.match { background: conic-gradient(#ff291f, #ffcc00, #30c25a, #0a84ff, #8754f2, #ff291f); }
  .row.first { margin-top: 8px; }
  .interact-hint { flex-basis: 100%; margin: 0; }
  table.keys { margin-top: 6px; }
  kbd { font: 12px ui-monospace, Consolas, monospace; background: var(--tile); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  tr:first-child td { border-top: 0; }
  td:first-child { width: 45%; }
  footer { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .warn { background: #fff4d6; color: #5b4300; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
  @media (prefers-color-scheme: dark) { .warn { background: #3a3218; color: #f5e3a8; } }
  .pick { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; place-items: center; padding: 24px; }
  .pick[hidden] { display: none; }
  .pick .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; width: min(420px, 100%); text-align: center; }
  .pick img { width: 64px; height: 64px; }
  .pick h1 { font: 600 20px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 12px 0 4px; }
  .pick p { color: var(--muted); margin: 0 0 20px; }
  .pick .choices { display: grid; gap: 10px; }
  .pick .choice { border: 1px solid var(--line); background: var(--tile); color: var(--text); border-radius: 12px; padding: 14px 16px; font: 600 16px inherit; font-family: inherit; cursor: pointer; }
  .pick .choice:hover { border-color: var(--accent); }
  .pick .choice.suggested { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  @media (max-width: 520px) { header { flex-wrap: wrap; } input[type=range] { width: 100%; } }
</style>
</head>
<body>
<div class="pick" id="pick" hidden>
  <div class="card" role="dialog" aria-labelledby="pick-title">
    <img src="icon.png" alt="">
    <h1 id="pick-title">Choose your language · Chọn ngôn ngữ</h1>
    <p>You can change this later in Settings.<br>Bạn có thể đổi lại trong phần Cài đặt.</p>
    <div class="choices" id="pick-choices"></div>
  </div>
</div>
<main>
  <header>
    <img src="icon.png" width="48" height="48" alt="">
    <div class="grow">
      <h1>TinyHand</h1>
      <p data-i18n="tagline"></p>
    </div>
    <button class="power" id="power"></button>
  </header>

  <div class="warn" id="unsupported" data-i18n="unsupported" hidden></div>

  <div class="welcome" id="welcome" hidden>
    <div data-i18n-html="welcomeHtml"></div>
    <button class="btn" id="got-it" data-i18n="gotIt"></button>
  </div>

  <section>
    <h2 data-i18n="pointer"></h2>
    <div class="sub">
      <h3 data-i18n="inToolbar"></h3>
      <span class="count" id="pin-count"></span>
      <button class="link" id="pin-reset" data-i18n="reset"></button>
    </div>
    <div class="strip" id="strip" role="list" data-i18n-aria="stripLabel"></div>
    <p class="hint" data-i18n="stripHint"></p>
    <p class="message" id="pin-message" role="status" hidden></p>
    <div class="sub all"><h3 data-i18n="allPointers"></h3></div>
    <div class="grid" id="styles"></div>
    <div class="row first">
      <label class="name" for="size" data-i18n="size"></label>
      <input type="range" id="size" min="0.08" max="0.20" step="0.005">
    </div>
    <div class="row">
      <label class="name" for="shadow" data-i18n="shadow"></label>
      <input type="checkbox" id="shadow">
    </div>
  </section>

  <section>
    <h2 data-i18n="taps"></h2>
    <div class="row">
      <label class="name" for="hand-sound" data-i18n="handSound"></label>
      <input type="checkbox" id="hand-sound">
    </div>
    <div class="row">
      <label class="name" for="laser-sound" data-i18n="laserSound"></label>
      <input type="checkbox" id="laser-sound">
    </div>
    <div class="row">
      <label class="name" for="tap-sound" data-i18n="tapSound"></label>
      <select id="tap-sound"></select>
      <button class="btn" id="preview" data-i18n="play"></button>
    </div>
    <div class="row">
      <label class="name" for="interact" data-i18n="interact"></label>
      <select id="interact">
        <option value="alt">Alt</option>
        <option value="ctrl">Ctrl</option>
        <option value="shift">Shift</option>
        <option value="off" data-i18n="off"></option>
      </select>
      <p class="hint interact-hint" data-i18n="interactHint"></p>
    </div>
  </section>

  <section>
    <h2 data-i18n="drawing"></h2>
    <div class="row">
      <span class="name" data-i18n="inkColour"></span>
      <div class="swatches" id="inks"></div>
    </div>
    <div class="row">
      <label class="name" for="fade" data-i18n="fadeAfter"></label>
      <select id="fade">
        <option value="1" data-i18n="sec1"></option>
        <option value="3" data-i18n="sec3"></option>
        <option value="5" data-i18n="sec5"></option>
        <option value="10" data-i18n="sec10"></option>
        <option value="0" data-i18n="never"></option>
      </select>
    </div>
  </section>

  <section>
    <h2 data-i18n="general"></h2>
    <div class="row">
      <label class="name" for="language" data-i18n="language"></label>
      <select id="language"></select>
    </div>
    <div class="row">
      <label class="name" for="login" data-i18n="login"></label>
      <input type="checkbox" id="login">
    </div>
    <table class="keys">
      <tr><td data-i18n="keyToggle"></td><td data-i18n-html="keyToggleHtml"></td></tr>
      <tr><td data-i18n="keyClear"></td><td><kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>X</kbd></td></tr>
      <tr><td data-i18n="keyOff"></td><td><kbd>Esc</kbd></td></tr>
    </table>
  </section>

  <footer>
    <span id="version"></span>
    <button class="btn" id="reset" data-i18n="resetAll"></button>
  </footer>
</main>
<script src="i18n.js"></script>
<script>
  const { invoke, convertFileSrc } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = id => document.getElementById(id);
  let state = null;
  const MAX_PINNED = 8;
  let dragId = null;
  let L = 'en';
  const t = (key, vars) => I18n.t(L, key, vars);

  function save(change) {
    const prefs = structuredClone(state.prefs);
    change(prefs);
    state.prefs = prefs;
    render();
    invoke('set_prefs', { prefs });
  }

  const titleOf = id => I18n.hand(L, id, (state.styles.find(s => s.id === id) || {}).title || id);

  function art(id, cls) {
    if (id === 'laser') return Object.assign(document.createElement('div'), { className: 'laser-dot' });
    return Object.assign(document.createElement('img'), { src: convertFileSrc(id, 'thumb'), alt: '', loading: 'lazy', className: cls || '' });
  }

  function setMessage(text) {
    $('pin-message').textContent = text;
    $('pin-message').hidden = !text;
  }

  function addToToolbar(id) {
    if (state.prefs.pinned.includes(id)) return;
    if (state.prefs.pinned.length >= MAX_PINNED) {
      setMessage(t('full', { name: titleOf(id) }));
      return;
    }
    setMessage('');
    save(q => {
      // Keep the laser dot last, like the Mac app.
      const at = q.pinned[q.pinned.length - 1] === 'laser' && id !== 'laser' ? q.pinned.length - 1 : q.pinned.length;
      q.pinned.splice(at, 0, id);
    });
  }

  function removeFromToolbar(id) {
    if (state.prefs.pinned.length <= 1) {
      setMessage(t('keepOne'));
      return;
    }
    setMessage('');
    save(q => { q.pinned = q.pinned.filter(x => x !== id); });
  }

  function movePinned(id, to) {
    save(q => {
      const from = q.pinned.indexOf(id);
      if (from < 0) return;
      q.pinned.splice(from, 1);
      q.pinned.splice(Math.max(0, Math.min(to > from ? to - 1 : to, q.pinned.length)), 0, id);
    });
  }

  function renderStrip() {
    const p = state.prefs;
    $('pin-count').textContent = t('count', { n: p.pinned.length, max: MAX_PINNED });
    const slots = p.pinned.map((id, i) => {
      const s = document.createElement('div');
      s.className = 'slot' + (id === p.style ? ' on' : '');
      s.setAttribute('role', 'listitem');
      s.tabIndex = 0;
      s.draggable = true;
      s.title = t('slotTitle', { name: titleOf(id) });
      const x = Object.assign(document.createElement('button'), { className: 'remove', textContent: '×', title: t('removeName', { name: titleOf(id) }) });
      x.setAttribute('aria-label', t('removeFromBar', { name: titleOf(id) }));
      x.onclick = e => { e.stopPropagation(); removeFromToolbar(id); };
      x.draggable = false;
      s.append(art(id), x);
      s.onclick = () => save(q => { q.style = id; });
      s.onkeydown = e => {
        if (e.ctrlKey && e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); movePinned(id, i - 1); }
        else if (e.ctrlKey && e.key === 'ArrowRight' && i < p.pinned.length - 1) { e.preventDefault(); movePinned(id, i + 2); }
        else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeFromToolbar(id); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); save(q => { q.style = id; }); }
      };
      s.ondragstart = e => {
        dragId = id;
        s.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
      };
      s.ondragend = () => {
        dragId = null;
        document.querySelectorAll('.slot').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop-after'));
      };
      const after = e => { const r = s.getBoundingClientRect(); return e.clientX > r.left + r.width / 2; };
      s.ondragover = e => {
        if (!dragId || dragId === id) return;
        e.preventDefault();
        s.classList.toggle('drop-after', after(e));
        s.classList.toggle('drop-before', !after(e));
      };
      s.ondragleave = () => s.classList.remove('drop-before', 'drop-after');
      s.ondrop = e => {
        e.preventDefault();
        if (dragId && dragId !== id) movePinned(dragId, after(e) ? i + 1 : i);
      };
      return s;
    });
    const empties = Array.from({ length: MAX_PINNED - p.pinned.length }, () => {
      const d = document.createElement('div');
      d.className = 'empty';
      d.setAttribute('aria-hidden', 'true');
      return d;
    });
    $('strip').replaceChildren(...slots, ...empties);
  }

  function renderStyles() {
    const p = state.prefs;
    $('styles').replaceChildren(...state.styles.map(s => {
      const t = document.createElement('div');
      t.className = 'tile' + (s.id === p.style ? ' on' : '');
      t.tabIndex = 0;
      t.setAttribute('role', 'button');
      t.setAttribute('aria-pressed', String(s.id === p.style));
      const title = titleOf(s.id);
      t.title = I18n.t(L, 'useName', { name: title });
      const name = Object.assign(document.createElement('span'), { className: 'name', textContent: title });
      const inBar = p.pinned.includes(s.id);
      const add = document.createElement('button');
      add.className = 'add' + (inBar ? ' in' : '');
      if (inBar) {
        add.append(
          Object.assign(document.createElement('span'), { className: 'is', textContent: I18n.t(L, 'inBadge') }),
          Object.assign(document.createElement('span'), { className: 'rm', textContent: I18n.t(L, 'removeShort') }));
      } else {
        add.textContent = I18n.t(L, 'addShort');
      }
      add.setAttribute('aria-label', I18n.t(L, inBar ? 'removeFromBar' : 'addToBar', { name: title }));
      add.onclick = e => { e.stopPropagation(); inBar ? removeFromToolbar(s.id) : addToToolbar(s.id); };
      t.append(art(s.id), name, add);
      const pick = () => save(q => { q.style = s.id; });
      t.onclick = pick;
      t.onkeydown = e => { if (e.target === t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(); } };
      return t;
    }));
  }

  function renderPicker() {
    const p = state.prefs;
    $('pick').hidden = !!p.language;
    if (p.language) return;
    const suggested = I18n.guess();
    $('pick-choices').replaceChildren(...I18n.LANGUAGES.map(([code, name]) => {
      const b = Object.assign(document.createElement('button'), { className: 'choice' + (code === suggested ? ' suggested' : ''), textContent: name });
      b.lang = code;
      b.onclick = () => save(q => { q.language = code; });
      return b;
    }));
    const first = $('pick-choices').querySelector('.suggested');
    if (first) first.focus();
  }

  function render() {
    const p = state.prefs;
    L = I18n.lang(p);
    const keyName = { alt: 'Alt', ctrl: 'Ctrl', shift: 'Shift' }[p.interactKey] || 'Alt';
    I18n.apply(L, document, { key: keyName });
    renderPicker();
    if (!$('language').options.length) {
      for (const [code, name] of I18n.LANGUAGES) $('language').add(new Option(name, code));
    }
    $('language').value = L;
    $('power').textContent = t(state.active ? 'powerOff' : 'powerOn');
    $('power').classList.toggle('on', state.active);
    $('unsupported').hidden = state.platformReady;
    $('welcome').hidden = p.welcomed;
    renderStrip();
    renderStyles();
    $('size').value = p.pointerSize;
    $('shadow').checked = p.showShadow;
    $('hand-sound').checked = p.handSound;
    $('laser-sound').checked = p.laserSound;
    $('tap-sound').replaceChildren(...state.sounds.map(([id, title]) => new Option(I18n.sound(L, id, title), id)));
    $('tap-sound').value = p.tapSound;
    $('interact').value = p.interactKey;
    $('fade').value = String(p.fadeSeconds);
    $('inks').replaceChildren(...state.inks.map(([id, title, color]) => {
      const b = document.createElement('button');
      b.className = 'swatch' + (id === 'match' ? ' match' : '') + (id === p.ink ? ' on' : '');
      if (color) b.style.background = color;
      b.title = I18n.ink(L, id, title);
      b.setAttribute('aria-label', b.title);
      b.onclick = () => save(q => { q.ink = id; });
      return b;
    }));
    $('login').checked = state.launchAtLogin;
    $('version').textContent = 'TinyHand ' + state.version + ' · ' + t('build') + ' ' + state.build;
  }

  $('power').onclick = () => invoke('set_active', { on: !state.active });
  $('got-it').onclick = () => save(q => { q.welcomed = true; });
  // Only save on release: each size change rebuilds the hand image.
  $('size').onchange = e => save(q => { q.pointerSize = parseFloat(e.target.value); });
  $('shadow').onchange = e => save(q => { q.showShadow = e.target.checked; });
  $('hand-sound').onchange = e => save(q => { q.handSound = e.target.checked; });
  $('laser-sound').onchange = e => save(q => { q.laserSound = e.target.checked; });
  $('tap-sound').onchange = e => { save(q => { q.tapSound = e.target.value; }); invoke('preview_sound', { id: e.target.value }); };
  $('preview').onclick = () => invoke('preview_sound', { id: $('tap-sound').value });
  $('interact').onchange = e => save(q => { q.interactKey = e.target.value; });
  $('fade').onchange = e => save(q => { q.fadeSeconds = parseFloat(e.target.value); });
  $('login').onchange = e => invoke('set_launch_at_login', { on: e.target.checked }).catch(err => {
    console.error(err);
    invoke('get_state').then(s => { state = s; render(); });
  });
  $('pin-reset').onclick = () => { setMessage(''); save(q => { q.pinned = [...state.defaultPinned]; }); };
  $('language').onchange = e => save(q => { q.language = e.target.value; });
  $('reset').onclick = () => invoke('reset_prefs');

  listen('state', e => { state = e.payload; render(); });
  invoke('get_state').then(s => { state = s; render(); });
</script>
</body>
</html>
