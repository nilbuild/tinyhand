[package]
name = "tinyhand-linux"
version = "1.0.2"
edition = "2021"
description = "TinyHand for Linux: a tiny hand on a stick that points at things on your screen"
license = "MIT"

[[bin]]
name = "tinyhand"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.14", features = ["xinput", "xfixes", "shape", "xtest", "xinerama"] }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ksni = { version = "0.3", features = ["blocking"] }
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
