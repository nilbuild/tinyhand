name: Windows

on:
  push:
    branches: [main]
    paths: ["desktop/**", "assets/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["desktop/**", "assets/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test core
        run: cargo test -p tinyhand-core
      - name: Build installer
        working-directory: desktop/app
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-windows
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
