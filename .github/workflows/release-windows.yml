name: Release (Windows)

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

concurrency:
  group: release-windows-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        shell: pwsh
        run: |
          $version = (Select-String -Path windows/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        working-directory: windows
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/TinyHand"
          New-Item -ItemType Directory -Force "$dir/assets/sounds" | Out-Null
          Copy-Item windows/target/release/tinyhand.exe "$dir/TinyHand.exe"
          Copy-Item assets/hand_*.png "$dir/assets/"
          Copy-Item assets/sounds/tap_*.wav "$dir/assets/sounds/"
          Copy-Item LICENSE "$dir/LICENSE"
          Copy-Item windows/README.md "$dir/README.md"
          $zip = "dist/TinyHand-Windows-$env:VERSION.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TinyHand-Windows-$env:VERSION.zip" | Out-File "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-Windows
          path: dist/*.zip*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = "dist/TinyHand-Windows-$env:VERSION.zip", "dist/TinyHand-Windows-$env:VERSION.zip.sha256"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title "TinyHand for Windows $env:VERSION" --notes-file windows/RELEASE_NOTES.md --prerelease
          }
