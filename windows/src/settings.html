<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyHand Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f8;
    --pane: #ffffff;
    --side: #ececf1;
    --card: #ffffff;
    --line: rgba(20, 20, 30, 0.09);
    --text: #1d1d22;
    --muted: #6b6b76;
    --hover: rgba(20, 20, 30, 0.06);
    --accent: #7c4dff;
    --accent-ink: #ffffff;
    --track: #c9c9d1;
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.06);
    --logo: url(__LOGO__);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b20;
      --pane: #202026;
      --side: #17171b;
      --card: #292930;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f2f2f6;
      --muted: #a2a2ae;
      --hover: rgba(255, 255, 255, 0.07);
      --accent: #9b7bff;
      --accent-ink: #14141a;
      --track: #4a4a55;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  nav {
    width: 200px;
    flex: none;
    background: var(--side);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  nav .brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 18px; font-weight: 600; font-size: 15px; }
  .logo { display: block; background: var(--logo) center / contain no-repeat; flex: none; }
  nav .brand .logo { width: 26px; height: 26px; }
  nav button {
    all: unset;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }
  nav button:hover { background: var(--hover); }
  nav button[aria-current="page"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
  main { flex: 1; overflow-y: auto; padding: 28px 32px 32px; background: var(--pane); }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { flex: 1; min-width: 0; }
  .row .label b { font-weight: 600; display: block; }
  .row .label span { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: -8px 4px 18px; }
  .switch { all: unset; width: 42px; height: 24px; border-radius: 12px; background: var(--track); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .switch:focus-visible, .seg button:focus-visible, .swatch:focus-visible, .tile:focus-visible, .btn:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; background: var(--hover); border-radius: 9px; padding: 3px; gap: 2px; flex: none; }
  .seg button { all: unset; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 600; }
  .slider { display: flex; align-items: center; gap: 12px; flex: none; width: 260px; }
  .slider output { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .swatch { all: unset; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); position: relative; }
  .swatch[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); }
  .swatch.match { background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #0a84ff, #8754f2, #ff3b30); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px; }
  .tile { all: unset; padding: 14px 10px; border-radius: 10px; text-align: center; cursor: pointer; background: var(--hover); border: 2px solid transparent; font-weight: 500; }
  .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--card); }
  .tile small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .btn { all: unset; padding: 7px 14px; border-radius: 8px; background: var(--hover); cursor: pointer; font-weight: 600; flex: none; }
  .btn:hover { background: var(--line); }
  .kbd { display: inline-flex; gap: 4px; flex: none; }
  .kbd kbd { font: 600 12px "Segoe UI", sans-serif; padding: 3px 8px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); border-bottom-width: 2px; }
  .strip-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 0; }
  .strip-head span { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .strip { display: flex; gap: 6px; padding: 14px 16px 6px; min-height: 100px; }
  .slot { position: relative; width: 52px; flex: none; }
  .slot.dragging { opacity: 0.4; }
  .slot.over .slotbtn { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .slotbtn { all: unset; box-sizing: border-box; width: 52px; height: 52px; border-radius: 11px; background: var(--hover); display: grid; place-items: center; cursor: pointer; border: 2px solid transparent; }
  .slotbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--card); }
  .slotbtn img { width: 40px; height: 40px; object-fit: contain; pointer-events: none; }
  .x { all: unset; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); color: var(--card); font-size: 13px; line-height: 18px; text-align: center; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .slot:hover .x, .x:focus-visible { opacity: 1; }
  .move { display: flex; justify-content: space-between; margin-top: 4px; }
  .move button { all: unset; width: 24px; height: 20px; border-radius: 6px; text-align: center; line-height: 20px; cursor: pointer; color: var(--muted); }
  .move button:hover:not([disabled]) { background: var(--hover); color: var(--text); }
  .move button[disabled] { opacity: 0.25; cursor: default; }
  .move button:focus-visible { outline: 2px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
  .cell { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; font-size: 12.5px; text-align: center; }
  .cell:hover { background: var(--hover); }
  .cell[aria-pressed="true"] { border-color: var(--accent); background: var(--hover); }
  .cell img, .cell .ph { width: 56px; height: 56px; object-fit: contain; }
  .cell .ph { border-radius: 10px; background: var(--hover); }
  .badge { position: absolute; top: 6px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-style: normal; font-size: 11px; line-height: 18px; text-align: center; display: none; }
  .cell[aria-pressed="true"] .badge { display: block; }
  .laser { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #ffdcd1 0 28%, #ff291f 30% 60%, rgba(255, 41, 31, 0.0) 100%); box-shadow: 0 0 14px 6px rgba(255, 41, 31, 0.45); display: inline-block; }
  #notice { min-height: 20px; padding: 0 16px 12px; color: #d9453a; font-size: 12.5px; }
  .about { text-align: center; padding: 28px 16px; }
  .about .logo { width: 84px; height: 84px; margin: 0 auto 12px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.28)); }
  .about h2 { margin: 0; font-size: 20px; }
  .about p { color: var(--muted); margin: 6px 0 0; }
  a.link { color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 600; }
  a.link:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav id="nav" aria-label="Settings sections"></nav>
<main id="page" tabindex="-1"></main>

<script>
const ICONS = {
  general: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  appearance: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
  drawing: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  about: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
};
ICONS.pointers = '<svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5.5"/><path d="M12 10.5a1.5 1.5 0 0 1 3 0V12"/><path d="M15 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.5 15a1.5 1.5 0 0 1 2.4-1.8L9 16"/></svg>';
const SECTIONS = [
  ['general', 'General'], ['pointers', 'Pointers'], ['appearance', 'Appearance'], ['drawing', 'Drawing'], ['sound', 'Sound'], ['about', 'About'],
];
const DEFAULT_PINNED = ['lavender', 'glove', 'coral', 'plush', 'robot', 'laser'];
const FADES = [[0, 'Never'], [1, '1 s'], [3, '3 s'], [5, '5 s'], [10, '10 s']];
const INKS = [['match', 'Match the pointer'], ['red', 'Red'], ['orange', 'Orange'], ['yellow', 'Yellow'], ['green', 'Green'], ['blue', 'Blue'], ['purple', 'Purple'], ['white', 'White'], ['black', 'Black']];
const INK_CSS = { red: '#ff291f', orange: '#ff8a00', yellow: '#ffcc00', green: '#30c25a', blue: '#0a84ff', purple: '#8754f2', white: '#ffffff', black: '#1d1d21' };
const SOUNDS = [['thock', 'Thock'], ['click', 'Click'], ['pop', 'Pop'], ['wood', 'Wood block'], ['boop', 'Boop'], ['squeak', 'Squeak']];
const INTERACT = [['alt', 'Alt'], ['ctrl', 'Ctrl'], ['shift', 'Shift'], ['off', 'Off']];

let S = null;
let page = 'general';
let THUMBS = {};
let notice = '';
let noticeTimer = 0;
let thumbRetries = 0;

const nameOf = (id) => (S.hands.find((h) => h.id === id) || { title: id }).title;
const picture = (id) => id === 'laser' ? '<span class="laser"></span>' : (THUMBS[id] ? `<img src="${THUMBS[id]}" alt="">` : '<span class="ph"></span>');

const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function set(key, value) {
  S[key] = value;
  send({ type: 'set', key, value });
  render();
}

const row = (title, desc, control) => `<div class="row"><div class="label"><b>${title}</b>${desc ? `<span>${desc}</span>` : ''}</div>${control}</div>`;
const toggle = (key, label) => `<button class="switch" role="switch" aria-label="${esc(label)}" aria-checked="${!!S[key]}" data-toggle="${key}"></button>`;
const seg = (key, options, current) => `<div class="seg" role="group">${options.map(([v, t]) => `<button aria-pressed="${String(v) === String(current)}" data-set="${key}" data-value='${JSON.stringify(v)}'>${t}</button>`).join('')}</div>`;
const keys = (combo) => `<span class="kbd">${combo.map((k) => `<kbd>${k}</kbd>`).join('')}</span>`;

const PAGES = {
  general: () => `
    <div class="card">
      ${row('Click through', 'Plain clicks reach the app under the pointer. Dragging still draws.', toggle('click_through', 'Click through'))}
      ${row('Hold to click for real', 'Hold this key to use your normal cursor and click apps directly.', seg('interact_key', INTERACT, S.interact_key))}
    </div>
    <div class="card">
      ${row('Turn the pointer on or off', '', keys(['Ctrl', 'Alt', 'H']))}
      ${row('Clear the drawing', '', keys(['Ctrl', 'Alt', 'X']))}
      ${row('Click through on or off', '', keys(['Ctrl', 'Alt', 'C']))}
      ${row('Exit and clear everything', '', keys(['Esc']))}
    </div>
    <div class="card">
      ${row('Reset all settings', 'Puts every setting back to how it was at first.', '<button class="btn" data-action="reset">Reset</button>')}
    </div>`,

  pointers: () => `
    <div class="card">
      <div class="strip-head"><b>Toolbar</b><span>${S.pinned.length} of ${S.max_pinned}</span></div>
      <div class="strip" id="strip">${S.pinned.map((id, i) => `
        <div class="slot" draggable="true" data-slot="${i}">
          <button class="slotbtn" aria-pressed="${S.style === id}" data-pick="${id}" title="${esc(nameOf(id))}. Click to use it." aria-label="Use ${esc(nameOf(id))}">${picture(id)}</button>
          <button class="x" aria-label="Remove ${esc(nameOf(id))} from the toolbar" data-pin="${id}">&times;</button>
          <div class="move">
            <button aria-label="Move ${esc(nameOf(id))} left" data-move="${i}" data-by="-1" ${i === 0 ? 'disabled' : ''}>&lsaquo;</button>
            <button aria-label="Move ${esc(nameOf(id))} right" data-move="${i}" data-by="1" ${i === S.pinned.length - 1 ? 'disabled' : ''}>&rsaquo;</button>
          </div>
        </div>`).join('')}</div>
      <div id="notice" role="status">${esc(notice)}</div>
    </div>
    <p class="hint">Click a pointer to use it. Use the arrows or drag to reorder. Your current pointer always shows on the toolbar.</p>
    <div class="card"><div class="grid">${S.hands.map((h) => `
      <button class="cell" aria-pressed="${S.pinned.includes(h.id)}" data-pin="${h.id}" title="${S.pinned.includes(h.id) ? 'Remove from' : 'Add to'} the toolbar">
        ${picture(h.id)}<span>${esc(h.title)}</span><i class="badge">&#10003;</i>
      </button>`).join('')}</div></div>
    <div class="card">
      ${row('Reset the toolbar', 'Go back to the original set of pointers.', '<button class="btn" data-action="reset-toolbar">Reset</button>')}
    </div>`,

  appearance: () => `
    <div class="card">
      ${row('Pointer size', 'How large the hand is on screen.', `<div class="slider"><input type="range" aria-label="Pointer size" min="${S.size_min}" max="${S.size_max}" step="0.005" value="${S.pointer_size}" data-slider="pointer_size"><output id="size-out">${Math.round(S.pointer_size * 100)}%</output></div>`)}
      ${row('Shadow', 'A soft shadow under the hand and stick.', toggle('shadow', 'Shadow'))}
    </div>`,

  drawing: () => `
    <div class="card">
      ${row('Drawings fade after', 'Strokes disappear on their own. Choose Never to keep them until you clear.', seg('fade_seconds', FADES, S.fade_seconds))}
      ${row('Ink color', 'Match the pointer, or use one color for everything.', `<div class="swatches" role="group" aria-label="Ink color">${INKS.map(([id, name]) => `<button class="swatch ${id === 'match' ? 'match' : ''}" title="${name}" aria-label="${name}" aria-pressed="${S.ink_choice === id}" style="${id === 'match' ? '' : `background:${INK_CSS[id]}`}" data-set="ink_choice" data-value='"${id}"'></button>`).join('')}</div>`)}
    </div>`,

  sound: () => `
    <div class="card">
      ${row('Hand pointers tap', 'Play a sound whenever you click with a hand.', toggle('sound_hands', 'Hand pointers tap'))}
      ${row('Laser dot taps', 'Play a sound whenever you click with the laser.', toggle('sound_laser', 'Laser dot taps'))}
    </div>
    <div class="card">
      <div class="tiles" role="group" aria-label="Tap sound">
        ${SOUNDS.map(([id, name]) => `<button class="tile" aria-pressed="${S.tap_sound === id}" data-sound="${id}">${name}</button>`).join('')}
      </div>
    </div>
    <p class="hint">Click a sound to choose it and hear it.</p>`,

  about: () => `
    <div class="card about">
      <div class="logo" role="img" aria-label="TinyHand logo"></div>
      <h2>TinyHand for Windows</h2>
      <p>Version ${esc(S.version)}</p>
      <p>A tiny hand on a stick that points at things on your screen.</p>
    </div>
    <div class="card">
      ${row('Unofficial Windows port', 'Based on TinyHand for Mac by Kamran Ahmed, released under the MIT license.', '')}
      ${row('Original project', 'The Mac app this port is based on.', '<a class="link" data-url="https://github.com/nilbuild/tinyhand">GitHub</a>')}
      ${row('Website', '', '<a class="link" data-url="https://tinyhand.app">tinyhand.app</a>')}
      ${row('Windows port source', '', '<a class="link" data-url="https://github.com/MUL7ii/tinyhand">GitHub</a>')}
    </div>`,
};

function render() {
  if (!S) return;
  $('#nav').innerHTML = `<div class="brand"><span class="logo" role="img" aria-label="TinyHand"></span>TinyHand</div>` + SECTIONS.map(([id, name]) =>
    `<button data-page="${id}" ${id === page ? 'aria-current="page"' : ''}>${ICONS[id]}${name}</button>`).join('');
  const title = SECTIONS.find(([id]) => id === page)[1];
  $('#page').innerHTML = `<h1>${title}</h1>${PAGES[page]()}`;
}
const $ = (s) => document.querySelector(s);

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-page],[data-toggle],[data-set],[data-sound],[data-action],[data-url],[data-pin],[data-pick],[data-move]');
  if (!t || !S) return;
  if (t.dataset.page) { page = t.dataset.page; render(); $('#page').scrollTop = 0; }
  else if (t.dataset.move !== undefined) {
    const from = Number(t.dataset.move), to = from + Number(t.dataset.by);
    if (to >= 0 && to < S.pinned.length) {
      const list = S.pinned.slice();
      list.splice(to, 0, list.splice(from, 1)[0]);
      S.pinned = list;
      send({ type: 'reorder', ids: list });
      render();
    }
  }
  else if (t.dataset.pin) send({ type: 'pin', id: t.dataset.pin });
  else if (t.dataset.pick) send({ type: 'pick', id: t.dataset.pick });
  else if (t.dataset.action === 'reset-toolbar') send({ type: 'reorder', ids: DEFAULT_PINNED });
  else if (t.dataset.toggle) set(t.dataset.toggle, !S[t.dataset.toggle]);
  else if (t.dataset.set) set(t.dataset.set, JSON.parse(t.dataset.value));
  else if (t.dataset.sound) { S.tap_sound = t.dataset.sound; send({ type: 'set', key: 'tap_sound', value: t.dataset.sound }); render(); }
  else if (t.dataset.action === 'reset') send({ type: 'reset' });
  else if (t.dataset.url) send({ type: 'open_url', url: t.dataset.url });
});

let pending = 0;
document.addEventListener('input', (e) => {
  const key = e.target.dataset && e.target.dataset.slider;
  if (!key) return;
  const value = parseFloat(e.target.value);
  S[key] = value;
  $('#size-out').textContent = Math.round(value * 100) + '%';
  clearTimeout(pending);
  pending = setTimeout(() => send({ type: 'set', key, value }), 30);
});

// Reordering the toolbar by dragging.
let dragFrom = -1;
document.addEventListener('dragstart', (e) => {
  const slot = e.target.closest && e.target.closest('.slot');
  if (!slot) return;
  dragFrom = Number(slot.dataset.slot);
  slot.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragFrom));
});
document.addEventListener('dragover', (e) => {
  const slot = e.target.closest && e.target.closest('.slot');
  if (!slot || dragFrom < 0) return;
  e.preventDefault();
  document.querySelectorAll('.slot.over').forEach((s) => s.classList.remove('over'));
  slot.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const slot = e.target.closest && e.target.closest('.slot');
  if (!slot || dragFrom < 0) return;
  e.preventDefault();
  const to = Number(slot.dataset.slot);
  if (to !== dragFrom) {
    const list = S.pinned.slice();
    list.splice(to, 0, list.splice(dragFrom, 1)[0]);
    S.pinned = list;
    send({ type: 'reorder', ids: list });
  }
  dragFrom = -1;
  render();
});
document.addEventListener('dragend', () => { dragFrom = -1; document.querySelectorAll('.slot.dragging,.slot.over').forEach((s) => s.classList.remove('dragging', 'over')); });

window.__state = (state) => { S = state; render(); };
window.__thumbs = (t) => {
  THUMBS = t;
  if (page === 'pointers') render();
  // They are built in the background after launch. Ask again until they are all here.
  if (S && Object.keys(t).length < S.hands.length - 1 && thumbRetries++ < 12) setTimeout(() => send({ type: 'thumbs' }), 700);
};
window.__notice = (text) => {
  notice = text;
  if (page === 'pointers') render();
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice = ''; if (page === 'pointers') render(); }, 3500);
};
send({ type: 'get' });
</script>
</body>
</html>
